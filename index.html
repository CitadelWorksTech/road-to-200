<html lang="en">
<head>

<title>Forgeway</title>

<meta name="theme-color" content="#131B1F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style id="css">
:root{
  --paper:#F2F4F1; --field:#FFFFFF; --ink:#1D2B33; --muted:#5B6B70; --line:#D3DBD6;
  --route:#2F6F8F; --route-soft:rgba(47,111,143,.14); --sage:#4F7F5C; --amber:#B97F14; --warn-bg:#FBF1DC;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131B1F; --field:#1B252A; --ink:#E4EBE8; --muted:#97A8AB; --line:#2B3A40;
    --route:#6DB0D0; --route-soft:rgba(109,176,208,.16); --sage:#84B893; --amber:#E6AE45; --warn-bg:#2C2616;
  }
}
:root[data-theme="dark"]{
  --paper:#131B1F; --field:#1B252A; --ink:#E4EBE8; --muted:#97A8AB; --line:#2B3A40;
  --route:#6DB0D0; --route-soft:rgba(109,176,208,.16); --sage:#84B893; --amber:#E6AE45; --warn-bg:#2C2616;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(40px,7vw,64px);letter-spacing:-.01em}
h2{font-size:28px;margin-bottom:14px}
h3{font-size:20px;font-weight:600;margin:18px 0 6px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.where{font-family:var(--cond);font-size:22px;font-weight:600;color:var(--muted)}
.tabs{display:flex;gap:0;margin:22px 0 4px;border-bottom:2px solid var(--line)}
.tabs button{background:none;color:var(--muted);border:0;border-bottom:4px solid transparent;border-radius:0;margin-bottom:-2px;padding:10px 18px 8px;font-family:var(--cond);font-size:24px;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--route)}
.tabs button:hover{color:var(--ink)}
.scorecard{border-top:2px solid var(--ink);margin-top:10px}
.hole{display:grid;grid-template-columns:2.4em 1fr 1fr 2.6em;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.hole.head{font-size:13px;color:var(--muted);font-weight:600;padding:6px 0 4px}
.hole .hn{font-family:var(--cond);font-size:22px;font-weight:700;color:var(--muted)}
.hole.played .hn{color:var(--ink)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;min-height:0;padding:0;font-size:22px;line-height:1;background:transparent;color:var(--ink);border:1px solid var(--line)}
.stepper b{min-width:1.8em;text-align:center;font-family:var(--cond);font-size:24px;font-weight:600}
.hd{font-family:var(--cond);font-size:20px;font-weight:700;text-align:right}
.hd.down{color:var(--sage)}.hd.up{color:var(--amber)}
@media (max-width:440px){.stepper button{width:38px;height:40px;font-size:20px}.stepper b{min-width:1.4em;font-size:21px}.hole{gap:4px;grid-template-columns:1.8em 1fr 1fr 2.2em}.hd{font-size:18px}}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;flex:0 0 auto}
@media (max-width:520px){.tabs button{font-size:19px;padding:10px 8px 8px}}
@media (max-width:400px){.tabs button{font-size:17px;padding:10px 6px 8px}}
.live-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 0;padding:8px 14px;background:var(--route-soft);border-left:4px solid var(--route);font-size:15px}
.route svg{display:block;width:100%;height:auto;border-radius:8px}
.thumb svg{display:block;width:64px;height:40px}
.places{display:grid;gap:12px}
.ptop{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.ptop small{color:var(--muted);font-weight:500;margin-left:6px}
.pbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--route);border-radius:5px}
code.url{font-size:14px;word-break:break-all;background:var(--field);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
details.checkin{margin:22px 0 0;border:1px solid var(--line);border-left:4px solid var(--route);border-radius:6px;padding:12px 16px;background:var(--field)}
details.checkin summary{font-size:22px}
details.checkin p{margin:10px 0}
.pill{font-family:var(--body);font-size:14px;font-weight:600;background:var(--route-soft);color:var(--route);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.count{font-family:var(--body);font-size:15px;font-weight:500;color:var(--muted)}
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ms .m{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;opacity:.55}
.ms .m.got{opacity:1;border-color:var(--sage);background:var(--field)}
.ms .mi{font-size:24px;line-height:1}
.ms b{display:block;font-size:15px;line-height:1.25}
.ms small{color:var(--muted);font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.thumbs figure{margin:0}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
.thumbs figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.compare select{width:100%;margin-bottom:6px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
#toast{position:fixed;left:50%;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-weight:600;max-width:min(92vw,520px);z-index:60;transition:all .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#wo{position:fixed;inset:0;background:var(--paper);z-index:50;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.woin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
.woin h2{font-size:40px;margin:6px 0 0}
.wok{font-family:var(--cond);font-size:20px;font-weight:600;color:var(--muted);margin:0}
.wobig{font-family:var(--cond);font-size:88px;font-weight:700;line-height:1;margin:18px 0 6px}
.wobig.sm{font-size:40px;margin:4px 0}
.wobar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.wobar i{display:block;height:100%;background:var(--route)}
.wopush{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;margin:10px 0}
#wo .backup button{flex:1;min-height:56px;font-size:19px}
.woquit{align-self:center;margin-top:18px}
.hole-x{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:4px 0 10px 2.4em;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.hole.played{border-bottom:0}
.chip{min-height:32px;padding:2px 12px;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px}
.chip.yes{border-color:var(--sage);color:var(--sage)}
.chip.no{border-color:var(--amber);color:var(--amber)}
.stepper.sm button{width:32px;height:32px;font-size:18px}
.stepper.sm b{font-size:18px;min-width:1.4em}
input.tm{width:auto;min-height:36px;padding:4px 6px;font-size:15px;margin-left:6px}
.top{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;gap:12px}
.gear{background:transparent;border:1px solid var(--line);color:var(--ink);width:48px;height:48px;min-height:0;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:6px}
.back{padding:0;margin-bottom:6px;font-size:16px}
.subnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 6px;padding-bottom:4px}
.subnav .chip{white-space:nowrap;min-height:40px;font-size:15px;font-weight:600;padding:6px 14px}
.subnav .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.subnav .chip.add{border-style:dashed;color:var(--muted)}
.gshead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.gshead h2{margin:0}
.gshead button{min-height:40px;padding:6px 14px;font-size:15px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:8px}
.goal{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--field)}
.goal.done{border-color:var(--sage)}
.goal.done .pbar i{background:var(--sage)}
.gtop{display:flex;align-items:center;gap:8px}
.gtop b{flex:1;font-size:16px;line-height:1.25}
.gi{font-size:22px}
.gdel{padding:0 4px;text-decoration:none;font-size:16px}
.gmeta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.goal .pbar{margin-top:10px}
.moods{border:0;padding:0;margin:16px 0 4px}
.moods legend{font-size:14px;font-weight:500;color:var(--muted);padding:0;margin-bottom:6px}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.moods label{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;min-width:52px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--muted);font-size:11px}
.moods input{position:absolute;opacity:0;width:1px;height:1px}
.moods .em{font-size:26px;line-height:1.15}
.moods label:has(input:checked){border-color:var(--route);background:var(--route-soft);color:var(--ink)}
.moods label:has(input:focus-visible){outline:3px solid var(--route);outline-offset:2px}
.moodcell{font-size:20px}
#gw{position:fixed;inset:0;background:rgba(10,15,18,.55);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.gwin{background:var(--paper);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#gw{align-items:center}.gwin{border-radius:18px}}
.gwin h2{font-size:30px;margin:4px 0 16px}
.picks{display:grid;gap:10px;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:12px;text-align:left;background:var(--field);color:var(--ink);border:1px solid var(--line);min-height:56px;font-size:17px}
.pick span{font-size:24px}
.actlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.actrow{flex-direction:row;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:15px;min-height:44px}
.actrow input{width:20px;height:20px;accent-color:var(--route)}
.actrow .em{font-size:20px}
.setgrid{display:grid;gap:36px;margin-top:24px}
.setsec{border-top:3px solid var(--ink);padding-top:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;max-width:420px}
.daynav b{font-family:var(--cond);font-size:24px}
.daynav button{min-width:48px;font-size:24px;padding:4px 12px}
.pbar.over i{background:var(--amber)}
.pbar.pro i{background:var(--sage)}
.pbar.water i{background:#4AA3C8}
.favs{display:flex;flex-wrap:wrap;gap:8px}
.chip.fav{display:flex;flex-direction:column;align-items:flex-start;border-radius:10px;min-height:48px;padding:6px 12px;text-align:left}
.chip.fav b{font-size:15px}
.chip.fav small{color:var(--muted);font-size:12px;font-weight:500}
.meal{margin-bottom:16px}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.mealhead h3{margin:0}
.mealhead span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fitem b{display:block;font-size:16px;font-weight:600}
.fitem small{color:var(--muted);font-size:13px;margin-right:6px}
.factions{display:flex;gap:4px;flex:0 0 auto}
.factions .link{font-size:18px;text-decoration:none;min-width:36px;min-height:36px}
.moodstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.moodstrip div{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border:1px solid var(--line);border-radius:10px}
.moodstrip .em{font-size:24px}
.moodstrip b{font-family:var(--cond);font-size:22px}
.moodstrip small{font-size:11px;color:var(--muted)}
.insights{padding-left:20px;margin:12px 0 0}
.insights li{margin-bottom:8px}
.msshare{margin-left:auto;font-size:14px;padding:4px 6px}
.ms .m{align-items:center}
.status{font-size:19px;max-width:64ch;margin:10px 0 0}
.status strong{font-weight:600}
.chart{margin:22px 0 8px;width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:14px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--route);vertical-align:middle;margin-right:6px}
.legend i.pace{border-top:2px dashed var(--muted)}
.legend i.dot{width:8px;height:8px;border:0;border-radius:50%;background:var(--muted);opacity:.6}
.notes{margin:18px 0 0;display:grid;gap:8px}
.note{background:var(--warn-bg);border-left:4px solid var(--amber);padding:10px 14px;max-width:72ch}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;margin-top:44px}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:36px}}
section{min-width:0}
.plan{border-top:3px solid var(--ink);padding-top:14px}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 16px;margin:0 0 16px}
.targets div{font-size:14px;color:var(--muted)}
.targets b{display:block;font-family:var(--cond);font-size:26px;font-weight:600;color:var(--ink)}
.today{font-size:18px;font-weight:600;margin:0}
.daily{margin:0 0 16px;padding:10px 14px;border-left:4px solid var(--route);background:var(--route-soft)}
.daily p{margin:0}
.daily p+p{margin-top:4px;color:var(--muted);font-size:15px}
@media (max-width:480px){.targets{grid-template-columns:repeat(2,1fr)}}
.moves{margin:6px 0 0;padding-left:20px;color:var(--muted)}
form{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500;color:var(--muted)}
select,input[type=number],input[type=date],input[type=text]{font:500 17px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:44px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.wide{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:10px 22px;margin:16px 0}
.checks label{flex-direction:row;align-items:center;gap:8px;font-size:16px;color:var(--ink);min-height:32px}
.checks input{width:20px;height:20px;accent-color:var(--route)}
button{font:600 17px var(--body);border-radius:6px;padding:10px 18px;min-height:44px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
button.quiet{background:transparent;color:var(--ink);border-color:var(--line)}
button.link{background:none;border:0;padding:4px 6px;min-height:0;color:var(--muted);font-weight:500;font-size:14px;text-decoration:underline}
.saved{margin-left:12px;color:var(--muted);font-size:15px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font-weight:600;text-align:right;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.down{color:var(--sage);font-weight:600}
td.up{color:var(--amber);font-weight:600}
.empty{color:var(--muted);margin:0}
.history{margin-top:44px}
.block{margin-top:44px}
.pushchart{overflow-x:auto;margin:4px 0 6px}
.pushchart svg{display:block;width:100%;height:auto}
.pushstats{display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--muted);font-size:15px;margin:0}
.pushstats b{color:var(--ink);font-weight:600}
.sum{font-size:14px;color:var(--muted);min-height:1.4em}
.sum.hit{color:var(--sage);font-weight:600}
input[readonly]{opacity:.75}
.history td:last-child{text-align:left;white-space:normal;min-width:120px;color:var(--muted)}
details{margin-top:44px;border-top:1px solid var(--line);padding-top:14px}
summary{font-family:var(--cond);font-size:22px;font-weight:600;cursor:pointer}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px;margin:16px 0}
.backup{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.filebtn{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;font:600 17px var(--body);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 18px;min-height:44px;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:3px solid var(--route);outline-offset:2px}
.foot{color:var(--muted);font-size:14px;margin-top:10px}

</style>

<script id="app-js">
(function(){
const DEF={settings:{startDate:"2026-09-23",startWeight:285,goal:255,checkpoint:270,calories:2300,protein:180,weeks:24,heightIn:72},entries:{},rounds:[],draft:null,walks:[],track:null,savedAt:0};
const LS="road255-state";
// Standalone app build: data is stored on this device in localStorage.
const HEAD='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Forgeway</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">\n';

const STR_B=["Reverse lunges, 8 per leg","Table or doorframe rows, 10–12","Step-ups (stairs), 10 per leg","Dead bugs, 10 per side"];

function norm(s){
  s=s&&typeof s==="object"?s:{};
  return {settings:Object.assign({},DEF.settings,s.settings||{}),entries:Object.assign({},s.entries||{}),rounds:Array.isArray(s.rounds)?s.rounds:[],draft:s.draft&&Array.isArray(s.draft.holes)?s.draft:null,walks:Array.isArray(s.walks)?s.walks:[],track:s.track&&Array.isArray(s.track.route)?s.track:null,workouts:Array.isArray(s.workouts)?s.workouts:[],throws:Array.isArray(s.throws)?s.throws:[],milestones:s.milestones&&typeof s.milestones==="object"?s.milestones:{},goals:Array.isArray(s.goals)?s.goals:[],sessions:Array.isArray(s.sessions)?s.sessions:[],acts:s.acts&&typeof s.acts==="object"?s.acts:{list:["steps","golf"],custom:[]},foods:s.foods&&typeof s.foods==="object"?s.foods:{saved:[],log:{},scans:0},savedAt:s.savedAt||0};
}
function load(){
  let s=null;
  try{s=JSON.parse(document.getElementById("state").textContent)}catch(e){}
  s=norm(s);
  try{const l=JSON.parse(localStorage.getItem(LS)||"null");if(l&&(l.savedAt||0)>s.savedAt)s=norm(l)}catch(e){}
  return s;
}
let state=load();
let readOnly=false;

// ---------- dates ----------
function dn(iso){const[y,m,d]=iso.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
function iso(n){const d=new Date(n*864e5);return d.toISOString().slice(0,10)}
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function weekOf(date){return Math.floor((dn(date)-dn(state.settings.startDate))/7)+1}
function fmtDate(date){const d=new Date(dn(date)*864e5);return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"})}
function phase(w){return w<=4?"Foundation":w<=12?"Build":"Push"}
function stepsTarget(w){w=Math.max(1,w);return Math.min(10000,5500+1000*Math.floor((w-1)/2))}
function pushTarget(w){w=Math.max(1,w);return Math.min(60,20+10*Math.floor((w-1)/2))}
const SURF={counter:"Counter",chair:"Chair or bench",floor:"Floor"};
function parseSets(v){return String(v||"").split(/[^0-9]+/).map(Number).filter(n=>n>0&&n<1000)}
function pushTotal(e){if(!e)return null;if(e.pushSets&&e.pushSets.length)return e.pushSets.reduce((a,b)=>a+b,0);return num(e.pushups)}
function pushHit(d){const t=pushTotal(state.entries[d]);return t!=null&&t>=pushTarget(weekOf(d))}
function pushStreak(){let n=dn(todayIso());if(!pushHit(iso(n)))n--;let c=0;while(pushHit(iso(n))){c++;n--}return c}
function isHoliday(date){const md=date.slice(5);return md>="11-23"||md<="01-02"}
function dayPlan(date){
  const w=Math.max(1,weekOf(date));const dow=new Date(dn(date)*864e5).getUTCDay();
  const odd=w%2===1;
  const A={label:"Strength A + walk",moves:STR_A},B={label:"Strength B + walk",moves:STR_B};
  switch(dow){
    case 1:return odd?A:B;
    case 3:return odd?B:A;
    case 5:return odd?A:B;
    case 2:return{label:"Long walk, 30–45 min",moves:[]};
    case 4:return{label:"Walk",moves:[]};
    case 6:return{label:"Disc golf. Walk the course.",moves:[]};
    default:return{label:"Rest or an easy walk. Review the week.",moves:[]};
  }
}

// ---------- numbers ----------
const r1=v=>Math.round(v*10)/10;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function sortedDates(){return Object.keys(state.entries).sort()}
function weights(){return sortedDates().filter(d=>num(state.entries[d].weight)!=null).map(d=>({d,n:dn(d),w:num(state.entries[d].weight)}))}
function num(v){const n=parseFloat(v);return isFinite(n)?n:null}
function rolling(ws,n){const a=ws.filter(x=>x.n<=n&&x.n>n-7).map(x=>x.w);return avg(a)}
function weekly(){
  const by={};
  for(const d of [...new Set([...sortedDates(),...state.walks.map(x=>x.date)])].sort()){const w=weekOf(d);(by[w]=by[w]||[]).push(Object.assign({_hit:pushHit(d),_steps:dayStepsTotal(d)},state.entries[d]||{}))}
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(w=>{
    const es=by[w];const pick=k=>avg(es.map(e=>num(e[k])).filter(v=>v!=null));
    return{w,weight:pick("weight"),cal:pick("calories"),pro:pick("protein"),steps:pick("_steps"),push:pick("pushups"),waist:(es.map(e=>num(e.waist)).filter(v=>v!=null).pop()??null),weighins:es.filter(e=>num(e.weight)!=null).length,pushHits:es.filter(e=>e._hit).length,pushDays:es.filter(e=>pushTotal(e)!=null).length,sessions:es.filter(e=>e.session).length,days:es.length};
  });
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// ---------- chart ----------
function cw(){const w=(document.documentElement.clientWidth||800)-40;return Math.round(Math.min(800,Math.max(340,w)))}
function chart(){
  const S=state.settings,ws=weights();
  const W=cw(),H=W<600?300:330,L=40,R=W<600?40:78,T=16,B=32;
  const s0=dn(S.startDate),span=Math.max(S.weeks*7,(ws.length?ws[ws.length-1].n-s0+7:0));
  const lo=Math.floor(Math.min(S.goal-4,...ws.map(x=>x.w))/5)*5,hi=Math.ceil(Math.max(S.startWeight+3,...ws.map(x=>x.w))/5)*5;
  const X=n=>L+(n-s0)/span*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g="";
  for(let v=lo;v<=hi;v+=5){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`}
  for(let wk=0;wk*7<=span;wk+=4){const x=X(s0+wk*7);g+=`<text x="${x}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)">Wk ${wk+1}</text>`}
  const mile=(v,col,label)=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-width="2"/><text x="${W-R+6}" y="${Y(v)+4}" font-size="13" font-weight="600" fill="${col}">${label}</text>`;
  g+=mile(S.checkpoint,"var(--amber)",W<600?""+S.checkpoint:S.checkpoint+" check");
  g+=mile(S.goal,"var(--sage)",W<600?""+S.goal:S.goal+" goal");
  g+=`<line x1="${X(s0)}" y1="${Y(S.startWeight)}" x2="${X(s0+S.weeks*7)}" y2="${Y(S.goal)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  g+=ws.map(p=>`<circle cx="${X(p.n)}" cy="${Y(p.w)}" r="3" fill="var(--muted)" opacity=".55"><title>${p.d}: ${p.w} lb</title></circle>`).join("");
  if(ws.length){
    const pts=ws.map(p=>[X(p.n),Y(rolling(ws,p.n))]);
    g+=`<path class="avgline" d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" L")}" fill="none" stroke="var(--route)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=ws[ws.length-1],la=rolling(ws,last.n),[lx,ly]=pts[pts.length-1];
    g+=`<circle cx="${lx}" cy="${ly}" r="6" fill="var(--paper)" stroke="var(--route)" stroke-width="3"/><text x="${lx}" y="${ly-14}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--route)">${r1(la)}</text>`;
  }else{
    g+=`<circle cx="${X(s0)}" cy="${Y(S.startWeight)}" r="6" fill="var(--paper)" stroke="var(--route)" stroke-width="3"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time with pace line and milestones" font-family="Barlow, system-ui, sans-serif">${g}</svg>`;
}

function pushChart(){
  const t=dn(todayIso()),s0=dn(state.settings.startDate),end=Math.max(t,s0+13),days=42,from=Math.max(s0,end-days+1),n=end-from+1;
  const W=cw(),H=190,L=36,R=12,T=12,B=28,bw=(W-L-R)/n;
  let mx=0;for(let i=0;i<n;i++){const d=iso(from+i);mx=Math.max(mx,pushTarget(weekOf(d)),pushTotal(state.entries[d])||0)}
  mx=Math.ceil((mx+5)/10)*10;const Y=v=>T+(mx-v)/mx*(H-T-B);
  let g="";
  for(let v=0;v<=mx;v+=mx>60?20:10)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
  let path="";
  for(let i=0;i<n;i++){
    const d=iso(from+i),x=L+i*bw,tot=pushTotal(state.entries[d]),tg=pushTarget(weekOf(d));
    path+=(i?" L":"M")+x.toFixed(1)+","+Y(tg).toFixed(1)+" L"+(x+bw).toFixed(1)+","+Y(tg).toFixed(1);
    if(tot!=null){const hit=tot>=tg;g+=`<rect x="${(x+bw*.15).toFixed(1)}" y="${Y(tot).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(Y(0)-Y(tot)).toFixed(1)}" rx="2" fill="${hit?"var(--sage)":"var(--amber)"}"><title>${d}: ${tot} of ${tg}</title></rect>`}
    if(new Date((from+i)*864e5).getUTCDay()===1)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date((from+i)*864e5).toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"})}</text>`;
  }
  g+=`<path d="${path}" fill="none" stroke="var(--route)" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily push-ups against target, last six weeks" font-family="Barlow, system-ui, sans-serif">${g}</svg>`;
}
function pushStatsHtml(){
  const ds=sortedDates().filter(d=>pushTotal(state.entries[d])!=null);
  if(!ds.length)return`<p class="empty">Log sets to see bars here. Green means the day hit its target, amber means it fell short. The blue line is the target.</p>`;
  const best=Math.max(...ds.map(d=>pushTotal(state.entries[d])));
  const hits=ds.filter(pushHit).length;
  const lastSurf=ds.slice().reverse().map(d=>state.entries[d].surface).find(Boolean);
  let bestStreak=0,run=0,prev=null;
  for(const d of ds){const n=dn(d);if(pushHit(d)){run=(prev!=null&&n===prev+1&&run)?run+1:1}else run=0;prev=n;bestStreak=Math.max(bestStreak,run)}
  return`<p class="pushstats"><span>Current streak <b>${pushStreak()}</b></span><span>Best streak <b>${bestStreak}</b></span><span>Days on target <b>${hits}/${ds.length}</b></span><span>Best day <b>${best}</b></span><span>Surface <b>${lastSurf?SURF[lastSurf]:"not set"}</b></span></p>`;
}

// ---------- status & notes ----------
function status(){
  const S=state.settings,ws=weights();
  if(!ws.length)return`Starting at <strong>${S.startWeight} lb</strong>. Log a morning weigh-in to start your line.`;
  const last=ws[ws.length-1],a=r1(rolling(ws,last.n));
  const lost=r1(S.startWeight-a);
  const toCheck=r1(a-S.checkpoint),toGoal=r1(a-S.goal);
  let next=toCheck>0?`<strong>${toCheck} lb</strong> to the ${S.checkpoint} checkpoint`:toGoal>0?`Checkpoint passed. <strong>${toGoal} lb</strong> to ${S.goal}`:`Goal reached. Time to set the next one`;
  return`7-day average <strong>${a} lb</strong>, ${lost>=0?"down "+lost:"up "+(-lost)} from the start. ${next}.`;
}
function notes(){
  const out=[],wk=weekly().filter(x=>x.weight!=null),cur=weekOf(todayIso());
  const done=wk.filter(x=>x.w<cur);
  if(done.length>=3){
    const a=done[done.length-1].weight,b=done[done.length-3].weight;
    if(a-b>-0.5)out.push("Weekly average hasn't dropped in two weeks. Check your logging first, especially weekends. If it's accurate, cut 150–200 calories or add 2,000 daily steps.");
  }
  if(done.length>=2&&done[done.length-1].w>4){
    const d=done[done.length-2].weight-done[done.length-1].weight;
    if(d>2.5)out.push("You lost more than 2.5 lb last week. Add about 200 calories to protect muscle and energy.");
  }
  if(isHoliday(todayIso()))out.push("Holiday stretch. Aim to hold your weight steady until January. That counts as a win.");
  return out.map(t=>`<p class="note">${t}</p>`).join("");
}

function has(e,keys){return e&&keys.some(k=>e[k]!=null&&e[k]!==""&&!(Array.isArray(e[k])&&!e[k].length))}

  </div>`;
}

function clearKeys(d,keys){const e=Object.assign({},state.entries[d]||{});keys.forEach(k=>delete e[k]);return e}
function commit(d,e){if(Object.keys(e).length)state.entries[d]=e;else delete state.entries[d]}

function say(t){const m=document.getElementById("msg");if(m)m.textContent=t}

// ---------- disc golf ----------
function vsPar(n){return n==null?"–":n===0?"E":(n>0?"+"+n:""+n)}
function roundPar(r){return r.holesData&&r.holesData.length?r.holesData.reduce((a,h)=>a+h.par,0):num(r.par)}
function roundScore(r){return r.holesData&&r.holesData.length?r.holesData.reduce((a,h)=>a+h.s,0):num(r.score)}
function roundHoles(r){return r.holesData&&r.holesData.length?r.holesData.length:num(r.holes)}
function roundDiff(r){const p=roundPar(r),s=roundScore(r);return p!=null&&s!=null?s-p:null}
function courses(){return [...new Set(state.rounds.map(r=>r.course).filter(Boolean))].sort()}
function roundsInWeek(w){return state.rounds.filter(r=>weekOf(r.date)===w).length}
function golfStreak(){let w=weekOf(todayIso());if(!roundsInWeek(w))w--;let c=0;while(c<520&&roundsInWeek(w)){c++;w--}return c}
function saveQuiet(){state.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}render();nativeSync();autoBackup()}
function lastPars(course,n){const r=state.rounds.filter(x=>x.course===course&&x.holesData&&x.holesData.length===n).sort((a,b)=>b.date.localeCompare(a.date))[0];return r?r.holesData.map(h=>h.par):null}

function golfChart(rs){
  const list=rs.filter(r=>roundDiff(r)!=null).slice(0,20).reverse();
  if(list.length<2)return"";
  const W=cw(),H=180,L=36,R=12,T=14,B=26,bw=(W-L-R)/list.length;
  const ds=list.map(roundDiff),mx=Math.max(3,...ds.map(Math.abs));const lim=Math.ceil(mx/3)*3;
  const Y=v=>T+(lim-v)/(2*lim)*(H-T-B);
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.5"/>`;
  for(const v of[-lim,0,lim])g+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${vsPar(v)}</text>`;
  list.forEach((r,i)=>{const d=ds[i],x=L+i*bw+bw*.15,y=Math.min(Y(0),Y(d)),h=Math.max(2,Math.abs(Y(d)-Y(0)));
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${d<=0?"var(--sage)":"var(--amber)"}"><title>${r.date} ${esc(r.course||"")}: ${vsPar(d)}</title></rect>`});
  g+=`<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">Older</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">Latest</text>`;
  return`<div class="pushchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score versus par, last ${list.length} rounds" font-family="Barlow, system-ui, sans-serif">${g}</svg></div>`;
}

function bindGolf(){
  const st=document.getElementById("gstart");
  if(st)st.addEventListener("submit",ev=>{
    ev.preventDefault();
    const course=st.elements.course.value.trim(),n=parseInt(st.elements.holes.value,10)||18,dp=Math.min(6,Math.max(2,parseInt(st.elements.par.value,10)||3));
    const pars=lastPars(course,n)||Array(n).fill(dp);
    state.draft={course,date:todayIso(),started:Date.now(),holes:pars.map(p=>({par:p,s:0}))};
    saveQuiet();window.scrollTo&&window.scrollTo(0,0);
  });
  document.querySelectorAll("[data-h]").forEach(b=>b.addEventListener("click",()=>{
    const d=state.draft;if(!d)return;const h=d.holes[+b.dataset.h],dv=+b.dataset.d;
    if(b.dataset.f==="par")h.par=Math.min(6,Math.max(2,h.par+dv));

  }));
  const fin=document.getElementById("finish");
  if(fin)fin.addEventListener("click",()=>{
    const d=state.draft,played=d.holes.filter(h=>h.s>0);
    if(!played.length){alert("Record at least one hole before finishing.");return}
    if(played.length<d.holes.length&&!confirm("Only "+played.length+" of "+d.holes.length+" holes have scores. Save just those holes?"))return;
    const minutes=Math.max(1,Math.round((Date.now()-d.started)/60000));
    state.rounds.push({id:Date.now(),date:d.date,course:d.course,holesData:played.map(h=>{const o={par:h.par,s:h.s};if(h.fw===true||h.fw===false)o.fw=h.fw;if(h.putts)o.putts=h.putts;return o}),minutes:minutes<=600?minutes:null});
    state.draft=null;persist("Round saved.");
  });
  const gg=document.getElementById("golfgps");if(gg)gg.addEventListener("click",()=>startTrack((state.draft&&state.draft.course)||"Disc golf course"));
  const dis=document.getElementById("discard");
  if(dis)dis.addEventListener("click",()=>{if(confirm("Discard this round? Scores entered so far will be lost.")){state.draft=null;saveQuiet()}});
  const lg=document.getElementById("glog");
  if(lg)lg.addEventListener("submit",ev=>{
    ev.preventDefault();const E=lg.elements,sc=num(E.score.value);
    if(sc==null){alert("Enter your total throws.");return}
    state.rounds.push({id:Date.now(),date:E.date.value||todayIso(),course:E.course.value.trim(),holes:num(E.holes.value),par:num(E.par.value),score:sc,minutes:num(E.minutes.value),note:E.note.value.trim()||undefined});
    persist("Round saved.");
  });
  document.querySelectorAll("[data-rdel]").forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Delete this round?"))return;state.rounds=state.rounds.filter(r=>String(r.id)!==b.dataset.rdel);persist("Round deleted.");
  }));
}

// ---------- steps, GPS walks, places, phone import ----------
const PLACES_DEF=["Home","Work","Neighborhood","Park","Disc golf course"];
function strideM(){return (num(state.settings.heightIn)||72)*0.0254*0.415}
function perMile(){return Math.round(1609.344/strideM())}
function walkSteps(d){return state.walks.filter(w=>w.date===d).reduce((a,w)=>a+(w.steps||0),0)}
function dayStepsTotal(d){const e=state.entries[d]||{};if(num(e.stepsAuto)!=null)return num(e.stepsAuto);const m=num(e.steps),w=walkSteps(d);return (m==null&&!w)?null:(m||0)+w}
function places(){return [...new Set([...PLACES_DEF,...state.walks.map(w=>w.place).filter(Boolean),...state.rounds.map(r=>r.course).filter(Boolean)])]}
function hav(a,b){const R=6371000,t=Math.PI/180,dl=(b[0]-a[0])*t,dg=(b[1]-a[1])*t,x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const mi=m=>m/1609.344;
function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0")}
function trackElapsed(t){return t.elapsed+(t.paused?0:Date.now()-t.resumedAt)}

function routeSvg(route,W,H,thumb){
  const pts=(route||[]).flat();
  if(pts.length<2)return thumb?"":`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map"><rect width="${W}" height="${H}" fill="var(--route-soft)" rx="8"/><text x="${W/2}" y="${H/2+5}" text-anchor="middle" font-size="15" fill="var(--muted)" font-family="Barlow, system-ui, sans-serif">Your route draws here as you walk</text></svg>`;
  const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length,kx=Math.cos(lat0*Math.PI/180)*111320,ky=110540;
  const P=p=>[p[1]*kx,-p[0]*ky],xy=pts.map(P);
  let x0=Math.min(...xy.map(p=>p[0])),x1=Math.max(...xy.map(p=>p[0])),y0=Math.min(...xy.map(p=>p[1])),y1=Math.max(...xy.map(p=>p[1]));
  const pad=thumb?4:18,dx=Math.max(x1-x0,40),dy=Math.max(y1-y0,40),sc=Math.min((W-2*pad)/dx,(H-2*pad)/dy);
  const ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2,T=p=>{const q=P(p);return[(ox+(q[0]-x0)*sc).toFixed(1),(oy+(q[1]-y0)*sc).toFixed(1)]};
  let g=thumb?"":`<rect width="${W}" height="${H}" fill="var(--route-soft)" rx="8"/>`;
  for(const seg of route){if(seg.length<2)continue;g+=`<path d="M${seg.map(p=>T(p).join(",")).join(" L")}" fill="none" stroke="var(--route)" stroke-width="${thumb?2:4}" stroke-linejoin="round" stroke-linecap="round"/>`}
  if(!thumb){const a=T(pts[0]),b=T(pts[pts.length-1]);g+=`<circle cx="${a[0]}" cy="${a[1]}" r="6" fill="var(--sage)"/><circle cx="${b[0]}" cy="${b[1]}" r="7" fill="var(--paper)" stroke="var(--route)" stroke-width="3"/>`}
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map">${g}</svg>`;
}

let watchId=null,wakeLock=null,lastFix=null,lastAcc=null,liveTimer=null,skips=0,lastSave=0,geoErr="";
async function keepAwake(){try{if("wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state.track&&!state.track.paused)keepAwake()});
function startWatch(){
  if(!("geolocation" in navigator)){alert("GPS isn't available in this browser.");return false}
  if(watchId!=null)return true;
  lastFix=null;skips=0;geoErr="";
  watchId=navigator.geolocation.watchPosition(onFix,onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  keepAwake();clearInterval(liveTimer);liveTimer=setInterval(updateLive,1000);
  return true;
}
function stopWatch(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;clearInterval(liveTimer);liveTimer=null;try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
function onGeoErr(err){
  if(err&&err.code===1){geoErr="Location permission is off. Allow location for this app in Android settings, then press Resume.";const t=state.track;if(t&&!t.paused){t.elapsed=trackElapsed(t);t.paused=true;stopWatch();saveQuiet()}}
  else geoErr="Looking for a GPS signal…";
  updateLive();
}
function onFix(p){
  const t=state.track;if(!t||t.paused)return;
  const c=p.coords;lastAcc=Math.round(c.accuracy);geoErr="";
  if(c.accuracy>35){updateLive();return}
  const pt=[+c.latitude.toFixed(6),+c.longitude.toFixed(6)],now=p.timestamp||Date.now();
  if(!t.route.length)t.route.push([]);
  const seg=t.route[t.route.length-1];
  if(!lastFix){seg.push(pt);lastFix={pt,time:now}}
  else{
    const d=hav(lastFix.pt,pt),dt=Math.max(1,(now-lastFix.time)/1000);
    if(d<Math.max(4,c.accuracy*0.4)){updateLive();return}
    if(d/dt>4){ if(++skips<3){updateLive();return} t.route.push([pt]);lastFix={pt,time:now};skips=0; }
    else{t.meters+=d;seg.push(pt);lastFix={pt,time:now};skips=0}
  }
  if(Date.now()-lastSave>10000){lastSave=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
  updateLive();
}
function updateLive(){
  const t=state.track;if(!t)return;const el=id=>document.getElementById(id),steps=Math.round(t.meters/strideM());
  if(el("lv-dist"))el("lv-dist").textContent=mi(t.meters).toFixed(2);
  if(el("lv-steps"))el("lv-steps").textContent=steps.toLocaleString();
  if(el("lv-time"))el("lv-time").textContent=fmtDur(trackElapsed(t));
  if(el("lv-acc"))el("lv-acc").textContent=geoErr||(t.paused?"Paused. GPS is off.":lastAcc==null?"Looking for a GPS signal…":lastAcc>35?"Weak GPS signal (±"+lastAcc+" m). Points are skipped until it improves.":"GPS accuracy ±"+lastAcc+" m");
  if(el("lv-route"))el("lv-route").innerHTML=routeSvg(t.route,600,260,false);
  if(el("banner-live"))el("banner-live").textContent=mi(t.meters).toFixed(2)+" mi, "+steps.toLocaleString()+" steps, "+fmtDur(trackElapsed(t));
}
function startTrack(place,actId){
  state.track={act:actId||undefined,place:place||"Neighborhood",date:todayIso(),startedAt:Date.now(),resumedAt:Date.now(),elapsed:0,paused:false,meters:0,route:[[]]};
  saveQuiet();startWatch();updateLive();
}
function simplifyRoute(route){
  const total=route.reduce((a,s)=>a+s.length,0);if(total<=500)return route;
  const k=Math.ceil(total/500);return route.map(s=>s.filter((p,i)=>i%k===0||i===s.length-1));
}
function finishTrack(){
  const t=state.track;if(!t)return;stopWatch();
  const ms=trackElapsed(t),steps=Math.round(t.meters/strideM());
  if(t.meters<20&&!confirm("This recorded almost no distance. Save it anyway?")){return}
  if(t.act){const mins=Math.max(1,Math.round(ms/60000));state.sessions.push({id:Date.now(),act:t.act,date:t.date,source:"gps",minutes:mins,miles:Math.round(mi(t.meters)*100)/100,route:simplifyRoute(t.route.filter(x=>x.length))});
    state.track=null;persist(actInfo(t.act).name+" saved: "+mi(t.meters).toFixed(2)+" mi, "+mins+" min.");return}
  state.walks.push({id:Date.now(),date:t.date,source:"gps",place:t.place,meters:Math.round(t.meters),steps,minutes:Math.max(1,Math.round(ms/60000)),route:simplifyRoute(t.route.filter(s=>s.length))});
  state.track=null;
  persist("Walk saved: "+mi(t.meters).toFixed(2)+" mi, "+steps.toLocaleString()+" steps.");
}

let importMsg="";
function handleImport(){
  try{
    const u=new URL(location.href),st=u.searchParams.get("steps");if(st==null)return;
    const n=parseInt(String(st).replace(/[^0-9]/g,""),10);let d=u.searchParams.get("date");
    if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))d=todayIso();
    if(isFinite(n)&&n>=0&&n<200000){
      const e=Object.assign({},state.entries[d]||{});e.stepsAuto=n;e.stepsAutoAt=Date.now();state.entries[d]=e;
      state.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
      importMsg="Imported "+n.toLocaleString()+" steps from your phone for "+fmtDate(d)+".";tab="steps";
    }else importMsg="The import link didn't include a valid step count.";
    history.replaceState(null,"",u.pathname);
  }catch(e){}
}

function stepsPanel(){
  const t=todayIso(),wd=Math.max(1,weekOf(t)),tg=stepsTarget(wd),tot=dayStepsTotal(t),tr=state.track,e=state.entries[t]||{};
  const pl=`<datalist id="placelist">${places().map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`;
  const lastPlace=(state.walks.slice().sort((a,b)=>b.id-a.id)[0]||{}).place||"Neighborhood";
  // 30-day breakdown by place
  const by={},cnt={},from=dn(t)-29;let untagged=0;
  for(let n=from;n<=dn(t);n++){const d=iso(n),ws=state.walks.filter(w=>w.date===d),ee=state.entries[d]||{},wsum=ws.reduce((a,w)=>a+(w.steps||0),0);
    ws.forEach(w=>{const k=w.place||"No place";by[k]=(by[k]||0)+(w.steps||0);cnt[k]=(cnt[k]||0)+1});
    if(num(ee.stepsAuto)!=null)untagged+=Math.max(0,num(ee.stepsAuto)-wsum);else if(num(ee.steps)!=null)untagged+=num(ee.steps);}

function bindSteps(){
  const ts=document.getElementById("tstart");
  if(ts)ts.addEventListener("submit",ev=>{ev.preventDefault();startTrack(ts.elements.place.value.trim())});
  const tp=document.getElementById("tpause");
  if(tp)tp.addEventListener("click",()=>{const t=state.track;if(!t)return;
    if(t.paused){t.paused=false;t.resumedAt=Date.now();t.route.push([]);saveQuiet();startWatch()}
    else{t.elapsed=trackElapsed(t);t.paused=true;stopWatch();saveQuiet()}
    updateLive();
  });
  const tf=document.getElementById("tfinish");if(tf)tf.addEventListener("click",finishTrack);
  const td=document.getElementById("tdiscard");if(td)td.addEventListener("click",()=>{if(confirm("Discard this walk?")){stopWatch();state.track=null;saveQuiet()}});
  const sp=document.getElementById("splog");
  if(sp)sp.addEventListener("submit",ev=>{ev.preventDefault();const E=sp.elements,n=num(E.steps.value);
    if(n==null||n<=0){alert("Enter a step count.");return}
    state.walks.push({id:Date.now(),date:E.date.value||todayIso(),source:"manual",place:E.place.value.trim()||"No place",steps:Math.round(n)});
    persist("Steps added.");
  });
  const ph=document.getElementById("phlog");
  if(ph)ph.addEventListener("submit",ev=>{ev.preventDefault();const E=ph.elements,n=num(E.steps.value),d=E.date.value||todayIso();
    if(n==null||n<0){alert("Enter your phone's step total.");return}
    const e=Object.assign({},state.entries[d]||{});e.stepsAuto=Math.round(n);e.stepsAutoAt=Date.now();state.entries[d]=e;persist("Phone total saved.");
  });
  const pc=document.getElementById("phclear");
  if(pc)pc.addEventListener("click",()=>{const d=todayIso(),e=Object.assign({},state.entries[d]||{});delete e.stepsAuto;delete e.stepsAutoAt;commit(d,e);persist("Phone total cleared.")});
  const cu=document.getElementById("copyurl");
  if(cu)cu.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+"?steps=%steps");cu.textContent="Copied"}catch(e){cu.textContent="Copy failed"}});
  bindHc();
  document.querySelectorAll("[data-wdel]").forEach(b=>b.addEventListener("click",()=>{if(!confirm("Delete this walk?"))return;state.walks=state.walks.filter(w=>String(w.id)!==b.dataset.wdel);persist("Walk deleted.")}));
  updateLive();
}

// ---------- Android app (Capacitor): built-in step counter + native backup ----------
const NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==="function"&&window.Capacitor.isNativePlatform());
const plug=n=>(NATIVE&&typeof window.Capacitor.registerPlugin==="function")?window.Capacitor.registerPlugin(n):null;
const SC=plug("StepCounter"),FS=plug("Filesystem"),SH=plug("Share");
const sc={checked:false,available:false,granted:false,enabled:false,lastAt:0,enabledAt:0,busy:false,error:""};
const errText=e=>String((e&&e.message)||e||"Unknown error");
function applySteps(r){
  sc.checked=true;sc.available=!!r.available;sc.granted=!!r.granted;sc.enabled=!!r.enabled;sc.lastAt=r.lastAt||0;sc.enabledAt=r.enabledAt||0;
  let changed=false;const days=r.days||{};
  for(const d of Object.keys(days)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
    const v=Math.round(Number(days[d])||0),e=Object.assign({},state.entries[d]||{});
    if(e.stepsAuto!==v){e.stepsAuto=v;e.stepsAutoAt=Date.now();state.entries[d]=e;changed=true}
  }
  if(changed){state.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
  return changed;
}
function quietRender(){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()}
async function scRefresh(){
  if(!SC)return;
  try{applySteps(await SC.getDays());sc.error=""}catch(e){sc.checked=true;sc.error=errText(e)}
  checkMilestones();checkGoals();quietRender();nativeSync();
}
async function scStart(){
  if(!SC||sc.busy)return;sc.busy=true;render();
  try{applySteps(await SC.start());sc.error="";sc.busy=false;persist("Step counting is on. Steps count from now on, all day.")}
  catch(e){sc.busy=false;const m=errText(e);sc.error=/DENIED|allowed/i.test(m)?"Physical activity permission is needed to count steps. Tap App settings, then Permissions, then Physical activity, and choose Allow.":m;render()}
}
async function scStop(){
  if(!SC)return;if(!confirm("Turn off step counting? Steps already counted are kept."))return;
  try{applySteps(await SC.stop());persist("Step counting is off.")}catch(e){sc.error=errText(e);render()}
}
let scTimer=null;
if(SC){
  setTimeout(scRefresh,300);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scRefresh()});
  scTimer=setInterval(()=>{if(document.visibilityState==="visible"&&sc.enabled)scRefresh()},60000);
}
function hcPanel(){
  if(!SC)return"";
  let body;
  if(!sc.checked)body=`<p class="foot">Checking the step counter…</p>`;
  else if(!sc.available)body=`<p>This phone doesn't have a step counter sensor. Use GPS walks or type your steps instead.</p>`;
  else if(!sc.enabled||!sc.granted)body=`<p>Count steps all day with your phone's built-in step sensor. No other apps needed. Android will ask to allow <strong>Physical activity</strong>.</p><div class="backup"><button type="button" id="scstart" ${sc.busy?"disabled":""}>${sc.busy?"Starting…":"Turn on step counting"}</button>${sc.error?`<button type="button" class="link" id="scsettings">App settings</button>`:""}</div>`;
  else{
    const last=sc.lastAt?new Date(sc.lastAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"waiting for your first steps";
    const firstDay=sc.enabledAt&&localKey(new Date(sc.enabledAt))===todayIso();
    body=`<p>On. Your phone counts steps all day, even when this app is closed. A small notification shows today's count. Last update: <strong>${esc(last)}</strong>.</p>${firstDay?`<p class="foot">Today started counting when you turned it on, so today's total is partial.</p>`:""}<div class="backup"><button type="button" class="quiet" id="screfresh">Refresh</button><button type="button" class="link" id="scstop">Turn off</button><button type="button" class="link" id="scsettings">App settings</button></div><p class="foot">If counts stop overnight, set Battery for this app to Unrestricted in App settings.</p>`;
  }
  return`<div class="daily" style="margin-bottom:18px"><p><strong>Built-in step counter</strong></p>${body}${sc.error?`<p class="foot" style="color:var(--amber)">${esc(sc.error)}</p>`:""}</div>`;
}
function localKey(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function bindHc(){
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.addEventListener("click",f)};
  on("scstart",scStart);on("scstop",scStop);on("screfresh",scRefresh);
  on("scsettings",async()=>{try{await SC.openSettings()}catch(e){sc.error=errText(e);render()}});

async function nativeExport(){

// ---------- weekly check-in ----------
function weekDates(w){const s=dn(state.settings.startDate)+(w-1)*7,t=dn(todayIso()),out=[];for(let n=s;n<s+7&&n<=t;n++)out.push(iso(n));return out}
function weekAdherence(w){
  const S=state.settings,ds=weekDates(w),st=stepsTarget(w);
  const c={days:ds.length,cal:0,calLogged:0,pro:0,steps:0,push:0,sessions:0,weighins:0};
  for(const d of ds){
    const e=state.entries[d]||{},cal=num(e.calories),pro=num(e.protein),sp=dayStepsTotal(d);
    if(cal!=null){c.calLogged++;if(cal<=S.calories+100)c.cal++}
    if(pro!=null&&pro>=S.protein-10)c.pro++;
    if(sp!=null&&sp>=st)c.steps++;
    if(pushHit(d))c.push++;
    if(e.session)c.sessions++;
    if(num(e.weight)!=null)c.weighins++;
  }
  c.score=c.days?Math.round((c.cal+c.pro+c.steps+c.push)/(c.days*4)*100):null;
  const wk=weekly().find(r=>r.w===w);c.weight=wk&&wk.weight!=null?wk.weight:null;
  const prev=weekly().find(r=>r.w===w-1);c.change=c.weight!=null&&prev&&prev.weight!=null?r1(c.weight-prev.weight):null;
  return c;
}
function projection(){
  const ws=weights(),t=dn(todayIso()),pts=ws.filter(p=>p.n>t-28);
  if(pts.length<5||pts[pts.length-1].n-pts[0].n<7)return null;
  const mx=avg(pts.map(p=>p.n)),my=avg(pts.map(p=>p.w));
  let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p.n-mx)*(p.w-my);sxx+=(p.n-mx)**2});
  const slope=sxx?sxy/sxx:0,now=my+slope*(t-mx);
  const eta=target=>slope<0&&now>target?t+Math.ceil((now-target)/-slope):null;
  return{perWeek:r1(slope*7),now:r1(now),check:eta(state.settings.checkpoint),goal:eta(state.settings.goal)};
}
function checkinHtml(){
  const w=weekOf(todayIso());if(w<1)return"";
  const cur=weekAdherence(w),last=w>1?weekAdherence(w-1):null,pr=projection(),S=state.settings;
  const isSun=new Date().getDay()===0;
  const row=(label,a,b)=>`<tr><td>${label}</td>${last?`<td>${b}</td>`:""}<td>${a}</td></tr>`;
  const f=(c,k)=>`${c[k]}/${c.days}`;
  const fmtEta=n=>n?new Date(n*864e5).toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"}):"–";
  let proj;
  if(!pr)proj=`<p class="foot">Log at least 5 weigh-ins over a week or more to see a projection.</p>`;
  else if(pr.perWeek>=0)proj=`<p>Trend: <strong>${pr.perWeek>0?"+":""}${pr.perWeek} lb/week</strong>. The last four weeks are flat or up, so there's no projection yet. Check weekend logging first.</p>`;
  else proj=`<p>Trend: <strong>${pr.perWeek} lb/week</strong>. At this pace: <strong>${S.checkpoint} by ${fmtEta(pr.check)}</strong>${pr.goal?`, <strong>${S.goal} by ${fmtEta(pr.goal)}</strong>`:""}.</p>${pr.perWeek<-2.5?`<p class="foot">That's faster than 2.5 lb/week. Consider eating about 200 more calories to protect muscle.</p>`:""}`;
  return`<details class="checkin" ${isSun?"open":""}>
    <summary>${isSun?"Sunday check-in":"Weekly check-in"}${cur.score!=null?` <span class="pill">${cur.score}% this week</span>`:""}</summary>
    ${proj}
    <div class="tablewrap"><table>
      <thead><tr><th></th>${last?`<th>Week ${w-1}</th>`:""}<th>Week ${w}${cur.days<7?" so far":""}</th></tr></thead>
      <tbody>
        ${row("Avg weight",cur.weight!=null?r1(cur.weight):"–",last&&last.weight!=null?r1(last.weight):"–")}
        ${row("Change",cur.change!=null?(cur.change>0?"+":"")+cur.change:"–",last&&last.change!=null?(last.change>0?"+":"")+last.change:"–")}
        ${row("Calories on target",f(cur,"cal"),last?f(last,"cal"):"")}
        ${row("Protein on target",f(cur,"pro"),last?f(last,"pro"):"")}
        ${row("Step target hit",f(cur,"steps"),last?f(last,"steps"):"")}
        ${row("Push-up target hit",f(cur,"push"),last?f(last,"push"):"")}
        ${row("Sessions done",cur.sessions,last?last.sessions:"")}
        ${row("Adherence",cur.score!=null?cur.score+"%":"–",last&&last.score!=null?last.score+"%":"–")}
      </tbody></table></div>
    <p class="foot">Adherence counts days on target for calories (within 100 of ${S.calories.toLocaleString()}), protein, steps and push-ups. 80% or better is a strong week.</p>
  </details>`;
}

function bestStreak(pred){const ds=sortedDates();let best=0,run=0,prev=null;for(const d of ds){const n=dn(d);if(pred(d)){run=(prev!=null&&n===prev+1&&run)?run+1:1}else run=0;prev=n;best=Math.max(best,run)}return best}
function currentAvg(){const ws=weights();return ws.length?rolling(ws,ws[ws.length-1].n):null}

// ---------- progress photos (stored on this device in IndexedDB) ----------
let photoCount=0,photoList=[],photoUrls={};
function pdb(){return new Promise((res,rej)=>{const r=indexedDB.open("road200-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function ptx(mode,fn){const db=await pdb();return new Promise((res,rej)=>{const tx=db.transaction("photos",mode),st=tx.objectStore("photos");const out=fn(st);tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);tx.onerror=()=>rej(tx.error)})}
async function loadPhotos(){
  try{const all=await ptx("readonly",st=>st.getAll());photoList=(all||[]).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);photoCount=photoList.length;
    for(const p of photoList)if(!photoUrls[p.id])photoUrls[p.id]=URL.createObjectURL(p.blob);
  }catch(e){photoList=[];photoCount=0}
}
async function shrink(file){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
  return new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",0.82));
}
async function addPhoto(file){
  try{const blob=await shrink(file),a=currentAvg(),id=Date.now();
    await ptx("readwrite",st=>st.put({id,date:todayIso(),weight:a!=null?r1(a):null,blob}));
    await loadPhotos();checkMilestones();render();showToast("Photo saved on this phone.");

// ---------- guided workout ----------
const WO_DEF={
  A:[{n:"Chair squats",r:"10–15 reps"},{n:"Incline push-ups (counter)",r:"8–12 reps",push:10},{n:"Glute bridges",r:"15 reps"},{n:"Plank",r:"20–40 seconds",hold:30}],
  B:[{n:"Reverse lunges",r:"8 per leg"},{n:"Table or doorframe rows",r:"10–12 reps"},{n:"Step-ups (stairs)",r:"10 per leg"},{n:"Dead bugs",r:"10 per side"}]
};
const WO_ROUNDS=3,WO_SHORT=20,WO_LONG=75;
let wo=null,woTimer=null,audioCtx=null;
function woSteps(type){const ex=WO_DEF[type],out=[];for(let r=1;r<=WO_ROUNDS;r++){ex.forEach((e,i)=>{out.push({kind:"ex",round:r,i,...e});const last=r===WO_ROUNDS&&i===ex.length-1;if(!last)out.push({kind:"rest",secs:i===ex.length-1?WO_LONG:WO_SHORT,next:i===ex.length-1?ex[0].n:ex[i+1].n})})}return out}
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.35)}catch(e){}}
function startWorkout(type){wo={type,steps:woSteps(type),i:0,started:Date.now(),push:[],endsAt:0,reps:WO_DEF[type].find(e=>e.push)?.push||0};keepAwake();woRender()}
function woEnd(){clearInterval(woTimer);woTimer=null;const el=document.getElementById("wo");if(el)el.remove();wo=null;if(!state.track){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}}
function woNext(){const s=wo.steps[wo.i];if(s&&s.kind==="ex"&&s.push)wo.push.push(wo.reps);wo.i++;const n=wo.steps[wo.i];if(n&&n.kind==="rest")wo.endsAt=Date.now()+n.secs*1000;if(n&&n.hold)wo.endsAt=0;woRender()}
function woRender(){
  let el=document.getElementById("wo");
  if(!el){el=document.createElement("div");el.id="wo";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Guided workout");document.body.appendChild(el)}
  clearInterval(woTimer);woTimer=null;
  const s=wo.steps[wo.i],total=wo.steps.filter(x=>x.kind==="ex").length,done=wo.steps.slice(0,wo.i).filter(x=>x.kind==="ex").length;
  const bar=`<div class="wobar"><i style="width:${Math.round(done/total*100)}%"></i></div>`;
  if(!s){
    const mins=Math.max(1,Math.round((Date.now()-wo.started)/60000)),push=wo.push.reduce((a,b)=>a+b,0);
    el.innerHTML=`<div class="woin">${bar}<p class="wok">Strength ${wo.type} complete</p><h2>Nice work.</h2>
      <p class="wobig">${mins} min</p>${moodPicker(wo.mood||null,"How did the workout go?")}<p>${push?`${push} push-ups in ${wo.push.length} sets will be added to today's push-up total.`:""}</p>
      <div class="backup"><button type="button" id="wosave">Save workout</button><button type="button" class="quiet" id="woquit">Don't save</button></div></div>`;
    el.querySelector("#wosave").onclick=()=>{
      const t=todayIso(),e=Object.assign({},state.entries[t]||{});e.session=true;
      if(push){const sets=(e.pushSets&&e.pushSets.length)?e.pushSets.slice():(num(e.pushups)?[num(e.pushups)]:[]);wo.push.forEach(x=>sets.push(x));e.pushSets=sets;e.pushups=sets.reduce((a,b)=>a+b,0)}
      const md=moodOf(el);if(md){if(!e.mood)e.mood=md}state.entries[t]=e;state.workouts.push({id:Date.now(),date:t,type:wo.type,minutes:mins,push,mood:md||undefined});
      woEnd();persist("Workout saved.");
    };
    el.querySelector("#woquit").onclick=()=>{if(confirm("Close without saving?"))woEnd()};
    beep();return;
  }
  const quit=`<button type="button" class="link woquit" id="woquit">End workout</button>`;
  if(s.kind==="rest"){
    const tick=()=>{const left=Math.max(0,Math.ceil((wo.endsAt-Date.now())/1000));const t=el.querySelector("#wotime");if(t)t.textContent=left;if(left<=0){beep();woNext()}};
    el.innerHTML=`<div class="woin">${bar}<p class="wok">Rest</p><p class="wobig" id="wotime" aria-live="polite">${s.secs}</p><p>Next: <strong>${esc(s.next)}</strong></p>
      <div class="backup"><button type="button" class="quiet" id="woadd">+15 sec</button><button type="button" id="woskip">Skip rest</button></div>${quit}</div>`;
    el.querySelector("#woadd").onclick=()=>{wo.endsAt+=15000;tick()};el.querySelector("#woskip").onclick=woNext;
    woTimer=setInterval(tick,250);
  }else{
    el.innerHTML=`<div class="woin">${bar}<p class="wok">Strength ${wo.type}, round ${s.round} of ${WO_ROUNDS}</p><h2>${esc(s.n)}</h2><p class="wobig sm">${esc(s.r)}</p>
      ${s.push?`<div class="wopush"><span>Reps done</span><span class="stepper"><button type="button" id="wom" aria-label="Fewer reps">−</button><b id="wor">${wo.reps}</b><button type="button" id="wop" aria-label="More reps">+</button></span></div>`:""}
      ${s.hold?`<p><button type="button" class="quiet" id="wohold">${wo.endsAt?"":"Start "+s.hold+"-second timer"}</button></p>`:""}
      <div class="backup"><button type="button" id="wodone">Done</button></div>${quit}</div>`;
    if(s.push){el.querySelector("#wom").onclick=()=>{wo.reps=Math.max(0,wo.reps-1);el.querySelector("#wor").textContent=wo.reps};el.querySelector("#wop").onclick=()=>{wo.reps=Math.min(99,wo.reps+1);el.querySelector("#wor").textContent=wo.reps}}
    if(s.hold){const hb=el.querySelector("#wohold");const tick=()=>{const left=Math.max(0,Math.ceil((wo.endsAt-Date.now())/1000));hb.textContent=left>0?left+" sec left":"Time! Tap Done";if(left<=0){clearInterval(woTimer);woTimer=null;beep()}};
      hb.onclick=()=>{if(woTimer)return;wo.endsAt=Date.now()+s.hold*1000;tick();woTimer=setInterval(tick,250)}}
    el.querySelector("#wodone").onclick=woNext;
  }
  el.querySelector("#woquit").onclick=()=>{if(confirm("End this workout? Nothing will be saved."))woEnd()};
}

// ---------- disc golf stats + throw measuring ----------
function golfStats(){
  let fwN=0,fwY=0,putts=0,puttHoles=0;
  for(const r of state.rounds)for(const h of (r.holesData||[])){if(h.fw===true||h.fw===false){fwN++;if(h.fw)fwY++}if(h.putts>0){putts+=h.putts;puttHoles++}}
  const th=state.throws.slice().sort((a,b)=>b.id-a.id),last10=th.slice(0,10).map(t=>t.feet);
  return{fw:fwN?Math.round(fwY/fwN*100):null,fwN,putt:putts?Math.round(puttHoles/putts*100):null,putts,puttHoles,avgPutts:puttHoles?r1(putts/puttHoles):null,
    longest:th.length?Math.max(...th.map(t=>t.feet)):null,avg10:last10.length?Math.round(avg(last10)):null,th};
}
let gm={phase:"idle",tee:null,cur:null,acc:null,samples:[],watch:null,result:null};
function gmStop(){if(gm.watch!=null)navigator.geolocation.clearWatch(gm.watch);gm.watch=null}
function gmAvg(){const good=gm.samples.filter(s=>s.acc<=25);const use=good.length?good:gm.samples;if(!use.length)return null;
  let w=0,la=0,lo=0;use.forEach(s=>{const k=1/Math.max(1,s.acc*s.acc);w+=k;la+=s.lat*k;lo+=s.lon*k});return{p:[la/w,lo/w],acc:Math.round(Math.min(...use.map(s=>s.acc)))}}
function gmWatch(){
  if(!("geolocation" in navigator)){alert("GPS isn't available here.");return false}
  gmStop();gm.watch=navigator.geolocation.watchPosition(p=>{const c=p.coords;gm.acc=Math.round(c.accuracy);gm.cur=[c.latitude,c.longitude];gm.samples.push({lat:c.latitude,lon:c.longitude,acc:c.accuracy});if(gm.samples.length>12)gm.samples.shift();gmLive()},()=>{gm.acc=null;gmLive()},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  keepAwake();return true;
}
function gmLive(){
  const el=document.getElementById("gmlive");if(!el)return;
  const acc=gm.acc==null?"Looking for GPS…":`GPS ±${gm.acc} m${gm.acc>15?" (wait for it to settle)":""}`;
  if(gm.phase==="walk"&&gm.tee&&gm.cur)el.textContent=`${Math.round(hav(gm.tee.p,gm.cur)*3.28084)} ft from the tee. ${acc}`;else el.textContent=acc;
}
async function gmMark(which){
  const btn=document.getElementById(which==="tee"?"gmtee":"gmdisc");if(btn){btn.disabled=true;btn.textContent="Hold still…"}
  gm.samples=gm.samples.slice(-2);await new Promise(r=>setTimeout(r,4000));
  const a=gmAvg();if(!a){alert("No GPS fix yet. Try again in a few seconds.");render();return}
  if(which==="tee"){gm.tee=a;gm.phase="walk"}else{gm.result={feet:Math.round(hav(gm.tee.p,a.p)*3.28084),err:Math.round((gm.tee.acc+a.acc)*3.28084/2)};gm.phase="done";gmStop()}
  render();
}
function golfExtras(){

  return`<div class="grid" style="margin-top:44px">
    <section class="plan">
      <h2>Measure a throw</h2>${meas}

    </section>
    <section>
      <h2>Your stats</h2>
      <div class="targets" style="grid-template-columns:repeat(3,1fr)">
        <div><b>${g.fw!=null?g.fw+"%":"–"}</b>fairways hit${g.fwN?` (${g.fwN})`:""}</div>
        <div><b>${g.putt!=null?g.putt+"%":"–"}</b>circle 1 putting</div>

        <div><b>${g.longest!=null?g.longest+" ft":"–"}</b>longest throw</div>
        <div><b>${g.avg10!=null?g.avg10+" ft":"–"}</b>avg last 10</div>
        <div><b>${g.th.length}</b>throws measured</div>
      </div>
      <p class="foot">Fairway and putting stats come from the Fairway and C1 putts buttons on the scorecard. C1 putting assumes your last putt on each hole went in.</p>
      ${g.th.length?`<div class="tablewrap"><table><thead><tr><th>Day</th><th>Distance</th><th>Disc</th><th>Course</th><th></th></tr></thead>
      <tbody>${g.th.slice(0,15).map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${t.feet} ft</td><td>${esc(t.disc||"–")}</td><td>${esc(t.course||"–")}</td><td><button type="button" class="link" data-tdel="${t.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`:""}
    </section>
  </div>`;
}

function areaKind(area){return area.startsWith("act:")?"act":area}
function goalType(g){return(GOAL_TYPES[areaKind(g.area)]||[]).find(x=>x.t===g.t)}
function goalProgress(g){const ty=goalType(g);if(!ty)return{cur:"",pct:0};try{return ty.prog(g,g.v,g.area.slice(4))}catch(e){return{cur:"",pct:0}}}
function goalLabel(g){const ty=goalType(g);if(g.name)return g.name;if(!ty)return"Goal";return ty.label(g.v,actInfo(g.area.slice(4)))}
function checkGoals(){
  const done=[];
  for(const g of state.goals){if(g.doneDate)continue;const p=goalProgress(g);if(p.done){g.doneDate=todayIso();done.push(g)}}
  if(done.length){state.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}showToast("🏆 Goal reached: "+done.map(goalLabel).join(", "))}
}
function goalsSection(area,title){
  const gs=state.goals.filter(g=>g.area===area).sort((a,b)=>(a.doneDate?1:0)-(b.doneDate?1:0)||a.created.localeCompare(b.created));
  const ms=allMilestones().filter(m=>msArea(m)===area),got=ms.filter(m=>state.milestones[m.id]).length;
  return`<div class="block goalsec"><div class="gshead"><h2>${esc(title||"Goals & milestones")}</h2><button type="button" data-newgoal="${esc(area)}">+ New goal</button></div>
    ${gs.length?`<div class="goals">${gs.map(g=>{const p=goalProgress(g),ty=goalType(g),pct=g.doneDate?100:Math.round(p.pct*100);
      const left=g.by&&!g.doneDate?dn(g.by)-dn(todayIso()):null;
      return`<div class="goal ${g.doneDate?"done":""}"><div class="gtop"><span class="gi" aria-hidden="true">${g.doneDate?"🏆":(ty?ty.icon:"⭐")}</span><b>${esc(goalLabel(g))}</b><button type="button" class="link gdel" data-gdel="${g.id}" aria-label="Delete goal ${esc(goalLabel(g))}">✕</button></div>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <div class="gmeta"><span>${g.doneDate?`Reached ${fmtDate(g.doneDate)} · <button type="button" class="link" data-share-goal="${g.id}">Share</button>`:esc(p.cur)}</span><span>${pct}%${left!=null?` · ${left>=0?left+" days left":"past due"}`:""}</span></div></div>`}).join("")}</div>`
      :`<p class="empty">No goals here yet. Tap <strong>+ New goal</strong> and answer a couple of questions to set one.</p>`}
    ${ms.length?`<h3>Milestones <small class="count">${got} of ${ms.length}</small></h3><div class="ms">${ms.map(m=>{const d=state.milestones[m.id];return`<div class="m ${d?"got":""}"><span class="mi" aria-hidden="true">${d?m.icon:"🔒"}</span><span><b>${esc(m.name)}</b><small>${d?fmtDate(d):"Not yet"}</small></span>${d?`<button type="button" class="link msshare" data-share-ms="${m.id}" aria-label="Share ${esc(m.name)}">Share</button>`:""}</div>`}).join("")}</div>`:""}
  </div>`;
}

// ----- modal (goal wizard, activity picker) -----
function openModal(html,label){closeModal(true);const el=document.createElement("div");el.id="gw";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",label||"Dialog");el.innerHTML=`<div class="gwin">${html}</div>`;document.body.appendChild(el);try{history.pushState({gw:1},"")}catch(e){}const f=el.querySelector("button,input");if(f)f.focus();return el}
function closeModal(silent){const el=document.getElementById("gw");if(el)el.remove()}
function dismissModal(){if(document.getElementById("gw")){try{history.back()}catch(e){closeModal()}}}
function goalWizard(area){
  const kind=areaKind(area),a=kind==="act"?actInfo(area.slice(4)):null;
  const types=(GOAL_TYPES[kind]||[]).filter(t=>!t.distOnly||(a&&a.dist));
  const where={weight:"weight",workout:"workouts",steps:"steps",golf:"disc golf",act:a?a.name.toLowerCase():""}[kind];
  const html=`<p class="wok">New ${esc(where)} goal</p><h2>What do you want to work toward?</h2>
    <div class="picks">${types.map(t=>`<button type="button" class="pick" data-gt="${t.t}"><span aria-hidden="true">${t.icon}</span>${esc(t.pick)}</button>`).join("")}</div>
    <button type="button" class="link" data-close>Cancel</button>`;
  let el=document.getElementById("gw");if(el)el.querySelector(".gwin").innerHTML=html;else el=openModal(html,"New goal");
  el.querySelector("[data-close]").onclick=dismissModal;
  el.querySelectorAll("[data-gt]").forEach(b=>b.onclick=()=>goalStep2(area,types.find(t=>t.t===b.dataset.gt)));
}
function goalStep2(area,ty){
  const el=document.getElementById("gw");if(!el)return;const a=actInfo(area.slice(4));
  el.querySelector(".gwin").innerHTML=`<p class="wok">${ty.icon} ${esc(ty.pick)}</p><h2>${esc(ty.q)}</h2>
    <form id="gwf" autocomplete="off">
      <div class="fields">
        <label class="wide">Target (${esc(ty.unit)})<input type="number" name="v" step="any" inputmode="decimal" required value="${ty.def()}"></label>
        <label class="wide">By when? (optional)<input type="date" name="by" min="${todayIso()}"></label>
        <label class="wide">Name it (optional)<input type="text" name="name" maxlength="60" placeholder="${esc(ty.label(ty.def(),a))}"></label>
      </div>
      <div class="backup"><button type="submit">Create goal</button><button type="button" class="quiet" id="gwback">Back</button></div>
    </form>`;
  const f=el.querySelector("#gwf");f.elements.v.focus();f.elements.v.select&&f.elements.v.select();
  el.querySelector("#gwback").onclick=()=>goalWizard(area);
  f.onsubmit=ev=>{ev.preventDefault();let v=num(f.elements.v.value);if(v==null||(!ty.allowNeg&&v<=0)){alert("Enter a target number.");return}
    const g={id:Date.now(),area,t:ty.t,v,created:todayIso()};if(f.elements.by.value)g.by=f.elements.by.value;const nm=f.elements.name.value.trim();if(nm)g.name=nm;
    const p=(()=>{try{return ty.prog(g,v,area.slice(4))}catch(e){return{}}})();if(p.done)g.doneDate=todayIso();
    state.goals.push(g);dismissModal();persist(p.done?"Goal created, and you've already reached it!":"Goal created.");};
}
function bindGoals(){
  document.querySelectorAll("[data-newgoal]").forEach(b=>b.addEventListener("click",()=>goalWizard(b.dataset.newgoal)));
  document.querySelectorAll("[data-gdel]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this goal?")){state.goals=state.goals.filter(g=>String(g.id)!==b.dataset.gdel);persist("Goal deleted.")}}));

// ---------- v4: food log, water, mood insights, share cards, automatic backup ----------
const MEALS=[["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snacks"]];
function foodsState(){const f=state.foods||{};return{saved:Array.isArray(f.saved)?f.saved:[],log:f.log&&typeof f.log==="object"?f.log:{},scans:f.scans||0}}
function foodDay(d){return foodsState().log[d]||[]}
function foodTotals(d){const l=foodDay(d);return{cal:Math.round(l.reduce((a,x)=>a+(x.cal||0)*(x.qty||1),0)),pro:Math.round(l.reduce((a,x)=>a+(x.pro||0)*(x.qty||1),0)),n:l.length}}
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?"breakfast":h<15?"lunch":h<20.5?"dinner":"snack"}
function waterGoal(){return num(state.settings.waterGoal)||100}
function setFoods(f){state.foods=f}
function syncFoodEntry(d){
  const t=foodTotals(d),e=Object.assign({},state.entries[d]||{});
  if(t.n){e.calories=t.cal;e.protein=t.pro;e.foodAuto=true}else if(e.foodAuto){delete e.calories;delete e.protein;delete e.foodAuto}
  commit(d,e);
}
function addFood(d,item){const f=foodsState();const l=(f.log[d]||[]).slice();l.push(Object.assign({id:Date.now()+Math.floor(Math.random()*1000)},item));f.log=Object.assign({},f.log,{[d]:l});setFoods(f);syncFoodEntry(d)}
function removeFood(d,id){const f=foodsState();const l=(f.log[d]||[]).filter(x=>String(x.id)!==String(id));const log=Object.assign({},f.log);if(l.length)log[d]=l;else delete log[d];f.log=log;setFoods(f);syncFoodEntry(d)}
function saveFavorite(item){const f=foodsState();if(f.saved.some(s=>s.name.toLowerCase()===item.name.toLowerCase()))return false;f.saved=f.saved.concat([{id:Date.now(),name:item.name,cal:item.cal,pro:item.pro||0,uses:0}]);setFoods(f);return true}
function addWater(d,oz){const e=Object.assign({},state.entries[d]||{});e.waterOz=Math.max(0,(num(e.waterOz)||0)+oz);e.water=e.waterOz>=waterGoal();if(!e.waterOz){delete e.waterOz;delete e.water}commit(d,e)}
